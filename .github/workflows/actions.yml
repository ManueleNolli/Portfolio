name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn lint --max-warnings 0
      - run: yarn format:check
      - run: yarn test
      - run: yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-folder
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write # OIDC token to assume the AWS deploy role
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-folder
          path: dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync static site to S3
        run: aws s3 sync --delete dist/ s3://${{ vars.AWS_S3_BUCKET_ASSETS_NAME }}/
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
